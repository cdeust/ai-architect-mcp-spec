name: Read Claude subscription quota
description: Measure the review account before requesting a model turn.
inputs:
  oauth_token:
    description: Existing Claude subscription token
    required: true
outputs:
  remaining:
    description: Lowest remaining window percentage, or unknown
    value: ${{ steps.usage.outputs.remaining }}
  eligible:
    description: All quota windows and subscription-only billing permit a review
    value: ${{ steps.usage.outputs.eligible }}
runs:
  using: composite
  steps:
    - name: Install the verified Claude CLI
      shell: bash
      run: |
        npm install --global --prefix "$RUNNER_TEMP/claude-quota-cli" @anthropic-ai/claude-code@2.1.328
        echo "$RUNNER_TEMP/claude-quota-cli/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/claude-quota-cli/bin/claude" --version | grep -Fx '2.1.328 (Claude Code)'
        tmux -V
    - name: Read subscription windows
      id: usage
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth_token }}
        QUOTA_ACTION_PATH: ${{ github.action_path }}
      run: python3 -I "$QUOTA_ACTION_PATH/read.py"
