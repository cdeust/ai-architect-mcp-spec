name: Read Claude subscription quota
description: Measure the review account before requesting a model turn.
inputs:
  oauth_token:
    description: Existing Claude subscription token
    required: true
outputs:
  remaining:
    description: Lowest remaining window percentage, or unknown
    value: ${{ steps.usage.outputs.remaining }}
  eligible:
    description: Both measured windows have headroom and usage credits are off
    value: ${{ steps.usage.outputs.eligible }}
runs:
  using: composite
  steps:
    - name: Install the verified Claude CLI
      shell: bash
      run: |
        install_dir="$RUNNER_TEMP/claude-quota-cli"
        mkdir -p "$install_dir"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$install_dir/"
        npm ci --prefix "$install_dir" --no-audit --no-fund
        echo "$install_dir/node_modules/.bin" >> "$GITHUB_PATH"
        "$install_dir/node_modules/.bin/claude" --version | grep -Fx '2.1.328 (Claude Code)'
        tmux -V
    - name: Read subscription windows
      id: usage
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth_token }}
        QUOTA_ACTION_PATH: ${{ github.action_path }}
      run: python3 -I "$QUOTA_ACTION_PATH/read.py"
