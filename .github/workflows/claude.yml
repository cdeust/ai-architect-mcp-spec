name: Claude Code

on:
  # zizmor: ignore[dangerous-triggers] -- owner gate, read-only model job and isolated publication from the default branch.
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  prepare:
    if: >-
      github.event.sender.login == github.repository_owner
      && ((github.event_name == 'issue_comment'
       && contains(github.event.comment.body, '@claude')
       && github.event.issue.user.login == github.repository_owner
       && github.event.comment.user.login != 'claude[bot]'
       && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'issues'
       && github.event.issue.user.login == github.repository_owner
       && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      revision: ${{ steps.target.outputs.revision }}
      branch: ${{ steps.target.outputs.branch }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - name: Resolve the owner request
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I control/scripts/ci-mention/request.py resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.revision }}
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: Install the locked preparation tools
        run: |
          npm ci --prefix control/.github/actions/claude-subscription-quota --no-fund
          npm ci --prefix control/scripts/ci-mention --ignore-scripts --no-fund
          mv candidate/.git "$RUNNER_TEMP/mention-index"
          mkdir "$RUNNER_TEMP/proposal"
      - name: Prepare the answer and proposed edits
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -I control/scripts/ci-mention/prepare.py
      - name: Record the proposed edit
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.target.outputs.revision }}
        run: |
          export GIT_DIR="$RUNNER_TEMP/mention-index" GIT_WORK_TREE="$PWD"
          git -c core.hooksPath=/dev/null add -A
          git diff --cached --binary --no-ext-diff --no-textconv "$BASE_SHA" > "$RUNNER_TEMP/proposal/change.patch"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owner-mention-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - name: Publish to the authorized branch
        env:
          EXPECTED_BRANCH: ${{ needs.prepare.outputs.branch }}
          BASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: python3 -I control/scripts/ci-mention/request.py publish
