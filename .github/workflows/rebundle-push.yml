name: Rebundle Dependabot (push)

# Commits the patch built by rebundle-build.yml back to the Dependabot branch,
# then dispatches the required checks on the new head. Runs from main with a
# write token and executes no PR code: only `git`, and `git apply` restricted
# to mcp-server/. A push by GITHUB_TOKEN triggers no workflow, except
# workflow_dispatch, which is why CI and CodeQL are dispatched explicitly.
# source: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow

on:
  workflow_run:
    workflows: ["Rebundle Dependabot (build)"]
    types: [completed]

permissions:
  contents: read

jobs:
  push:
    name: commit patch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebundle-patch
          path: ${{ runner.temp }}/patch
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Apply and push
        id: commit
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          patch="$RUNNER_TEMP/patch/rebundle.patch"
          if [ ! -s "$patch" ]; then
            echo "mcp-server/ already matches the source; nothing to commit."
            exit 0
          fi
          tip=$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "Branch moved past $HEAD_SHA; the run for its new head handles it."
            exit 0
          fi
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          if ! grep -q '^  workflow_dispatch:' .github/workflows/ci.yml; then
            echo "::error::Branch predates workflow_dispatch in ci.yml; comment '@dependabot rebase' and this runs again."
            exit 1
          fi
          git apply --index --binary --include='mcp-server/*' "$patch"
          if git diff --cached --no-renames --name-only | grep -qv '^mcp-server/'; then
            echo "::error::Patch touched a path outside mcp-server/."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(deps): rebundle mcp-server/ for this dependency bump'
          # No --force: fails if the branch moved since $HEAD_SHA.
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  dispatch:
    name: run required checks on the new head
    needs: push
    if: needs.push.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # Required contexts (branch protection): build + test (20.x/22.x),
      # mcpb smoke (ci.yml), Analyze (javascript-typescript) (codeql.yml).
      - name: Dispatch CI and CodeQL
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
