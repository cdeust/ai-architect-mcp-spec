# generated by zetetic-team-subagents render-ci
# KNOWN DIVERGENCE (owner decision of 2026-11-25): this copy merges on the
# owner's approval (label owner-approved) and reads no bot verdict. The
# zetetic-team-subagents template, paused by the owner, still renders the bot
# verdict gate; re-rendering would overwrite this. Do not run render-ci here
# until the template carries the change: test_ci_review_owner_approval.py,
# GeneratorDivergenceTests, fails if the rendered gate comes back.
name: Pipeline after merge

# GitHub rejects a workflow listening to itself (run40017492191).
# The local reusable retains this caller's workflow_run event context.
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
# The owner's approval and the Pipeline finish in either order: each completion
# wakes the resolver, which merges once both are there (ADR-1127). The review
# bots are optional and wake nothing (owner decision of 2026-11-25).
on:
  workflow_run:
    workflows: [Pipeline, Owner approval wake]
    types: [completed]
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  pipeline:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    # Only the completion engine is callable. It has no PR review job or OAuth
    # secret. Its jobs narrow these permissions; no caller concurrency.
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      attestations: read
    uses: ./.github/workflows/pipeline-post-merge.yml
    secrets:
      RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}

  # SEC-009, phase B: the receipt of the merge commit main now holds, from the
  # protected producer on main. Observation only: it runs after the merge and
  # its result changes nothing; phase C makes it the tests of record.
  receipt:
    needs: pipeline
    if: needs.pipeline.outputs.run_tests == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Deliberately the default branch, not a SHA: the receipt is valid only when its
    # signing certificate names tested-receipt.yml@refs/heads/main, the one
    # producer a pull request cannot choose or edit.
    uses: cdeust/ai-architect-mcp-spec/.github/workflows/tested-receipt.yml@main # zizmor: ignore[unpinned-uses]
    with:
      tested_sha: ${{ needs.pipeline.outputs.tested_sha }}
