name: Owner approval

# Owner decision of 2026-11-25: the merge rests on the owner's approval of the
# current head, the label `owner-approved` (docs/review-subscriptions.md). Its
# completion wakes the resolver (pipeline-after-merge.yml). The resolver reads
# the label's events itself; nothing this workflow prints approves anything.
on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  clear:
    name: Clear a stale approval
    # A new head was pushed: an approval given before it does not cover it.
    if: >-
      github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'owner-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; one API call.
    permissions:
      pull-requests: write
    steps:
      - name: Remove the owner-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label owner-approved

  approval:
    name: Owner approval recorded
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'owner-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; no step does work.
    steps:
      - name: Wake the resolver
        run: echo "The resolver checks who set the label and when"
