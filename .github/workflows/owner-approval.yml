name: Owner approval
# The record the resolver binds the owner's approval to (docs/review-subscriptions.md).
# pull_request_target runs this file as it is on main, so a pull request cannot
# change it. The title is the record: the action, the pull request, the label,
# the head commit at the event and who caused it. A pull_request_target run's
# head_sha is the base branch's commit, so the head is read from this title.
run-name: >-
  Owner approval ${{ github.event.action }} PR ${{ github.event.pull_request.number }}
  label ${{ github.event.label.name || '-' }} at ${{ github.event.pull_request.head.sha }}
  by ${{ github.actor }}

on:
  # zizmor: ignore[dangerous-triggers] no checkout and no code of the pull
  # request runs; the one step removes a label, with the PR number of the event.
  pull_request_target:
    types: [labeled, synchronize]

permissions: {}

jobs:
  clear:
    name: Clear a stale approval
    # A new head was pushed: the approval named another head. The resolver does
    # not rely on this removal; it keeps the label on the PR truthful.
    if: >-
      github.event.action == 'synchronize'
      && contains(github.event.pull_request.labels.*.name, 'owner-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; one API call.
    permissions:
      pull-requests: write
    steps:
      - name: Remove the owner-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label owner-approved

  record:
    name: Record the event
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; no step does work.
    steps:
      - name: The title of this run is the record
        run: echo "Read by the resolver from the run title"
