# source: cdeust/ai-architect-mcp-spec@50d2f3893900b50e96baa0de9b8173260391e7a2 .github/workflows/release.yml
# Existing artifact build, signing and publication commands retained.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag-ref dispatch builds and publishes that tag. Dispatch from a
          branch with this input only repairs its existing registry entry.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, test, and publish release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release, upload assets
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify product and distribution identities
        run: pnpm check:identity

      - name: Build all packages
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Rebuild and bundle MCP server
        run: pnpm bundle

      - name: Verify mcp-server bundle is current
        run: |
          if [ -d packages/mcp-server/dist ]; then
            git diff --exit-code packages/mcp-server/dist/ \
              || (echo "::error::mcp-server bundle out of date — run 'pnpm build' and commit"; exit 1)
          fi

      - name: Verify the numbers the docs advertise are still true
        run: |
          set -euo pipefail
          pnpm check:docs

      - name: Assemble .mcpb staging directory
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)/ai-architect-mcp-spec-mcpb"
          bash scripts/release/stage-mcpb.sh "${STAGE_DIR}"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

      - name: Smoke-test the staged bundle before packing it
        run: |
          set -euo pipefail
          bash scripts/release/smoke-mcpb.sh

      - name: Pack .mcpb bundle
        run: |
          set -euo pipefail
          OUTFILE="${GITHUB_WORKSPACE}/ai-architect-mcp-spec.mcpb"

          if npx -y --yes @anthropic-ai/mcpb@latest pack --help >/dev/null 2>&1; then
            npx -y @anthropic-ai/mcpb@latest pack "${STAGE_DIR}" "${OUTFILE}"
          else
            (cd "${STAGE_DIR}" && zip -r "${OUTFILE}" .)
          fi

          shasum -a 256 "${OUTFILE}" | awk '{print $1}' > "${OUTFILE}.sha256"
          echo "SHA256: $(cat "${OUTFILE}.sha256")"
          echo "MCPB_SHA256=$(cat "${OUTFILE}.sha256")" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM from pnpm-lock.yaml
        run: |
          set -euo pipefail
          npx -y @cyclonedx/cdxgen@12.8.2 -t pnpm --spec-version 1.5 \
            -o ai-architect-mcp-spec.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8'))"
          echo "SBOM components: $(node -e "console.log((JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8')).components||[]).length)")"
          shasum -a 256 ai-architect-mcp-spec.cdx.json | awk '{print $1}' > ai-architect-mcp-spec.cdx.json.sha256

      - name: Attest build provenance (.mcpb + SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.cdx.json

      - name: Patch a local copy of server.json with the real .mcpb checksum
        run: |
          set -euo pipefail
          jq --arg sha "${MCPB_SHA256}" '.packages[0].fileSha256 = $sha' server.json > server.json.tmp
          mv server.json.tmp server.json
          jq empty server.json
          echo "Locally patched fileSha256: $(jq -r '.packages[0].fileSha256' server.json)"

      - name: Verify the local server.json copy's checksum matches the built .mcpb
        run: |
          node scripts/release/verify-mcpb-checksum.mjs \
            ai-architect-mcp-spec.mcpb server.json

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]")) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using tag message" > release-notes.md
          fi
          {
            echo ""
            echo "### Canonical .mcpb bundle"
            echo "Artifact: \`ai-architect-mcp-spec.mcpb\`"
            echo "SHA-256: \`${MCPB_SHA256}\`"
          } >> release-notes.md

      - name: Create GitHub Release (with .mcpb artifact + SBOM)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.mcpb.sha256
            ai-architect-mcp-spec.cdx.json
            ai-architect-mcp-spec.cdx.json.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_registry:
    name: Publish server.json to the MCP Registry
    needs: [release]
    if: |
      always() &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token the MCP Registry exchanges for a publish credential
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TARGET_REF_TYPE" != "tag" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires a 'tag' input (e.g. v0.8.0) — refusing to guess which release to publish."
              exit 1
            fi
          else
            TAG="$TAG_REF"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify server.json version matches the tag being published
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' server.json)
          PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          [ "$TAG" = "v$VERSION" ] || { echo "::error::server.json version $VERSION does not match tag $TAG" >&2; exit 1; }
          [ "$VERSION" = "$PKG_VERSION" ] || { echo "::error::server.json top-level version $VERSION != packages[0].version $PKG_VERSION" >&2; exit 1; }
          IDENTIFIER=$(jq -r '.packages[0].identifier' server.json)
          case "$IDENTIFIER" in
            *"/releases/download/$TAG/"*) : ;;
            *) echo "::error::server.json packages[0].identifier ($IDENTIFIER) does not reference tag $TAG" >&2; exit 1 ;;
          esac

      - name: Download and verify the public .mcpb asset
        id: mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern 'ai-architect-mcp-spec.mcpb' \
            --pattern 'ai-architect-mcp-spec.mcpb.sha256'
          ACTUAL=$(shasum -a 256 ai-architect-mcp-spec.mcpb | awk '{print $1}')
          EXPECTED=$(cat ai-architect-mcp-spec.mcpb.sha256)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::ai-architect-mcp-spec.mcpb checksum mismatch: release asset is $ACTUAL, .sha256 companion says $EXPECTED" >&2; exit 1; }
          gh attestation verify ai-architect-mcp-spec.mcpb --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG"
          echo "digest=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher (checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euxo pipefail
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Patch fileSha256 into a runtime copy of server.json
        env:
          DIGEST: ${{ steps.mcpb.outputs.digest }}
        run: jq --arg sha "$DIGEST" '.packages[0].fileSha256 = $sha' server.json > server.runtime.json

      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish server.runtime.json 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "$OUTPUT" | grep -qi "duplicate version"; then
              echo "::notice::mcp-publisher reports ${{ steps.resolve.outputs.tag }} already published (workflow_dispatch recovery path) — treating as a candidate success, pending independent registry verification below."
            else
              echo "::error::mcp-publisher publish failed (exit ${STATUS})"
              exit "$STATUS"
            fi
          fi

      - name: Verify the registry now serves the published version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' server.runtime.json)
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          ACTUAL=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ACTUAL=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=ai-architect-mcp-spec" \
              | python3 -c "import json, sys; d = json.load(sys.stdin); latest = next(s for s in d['servers'] if s['server']['name'] == 'io.github.cdeust/ai-architect-mcp-spec' and s['_meta']['io.modelcontextprotocol.registry/official']['isLatest']); print(latest['server']['version'])")
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: registry reports latest version ${ACTUAL} (expected ${VERSION})"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Registry converged to ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "::error::MCP Registry still serves ${ACTUAL}, expected ${VERSION} after ${MAX_ATTEMPTS} attempts (~$((MAX_ATTEMPTS * SLEEP_SECONDS))s). This is a non-convergence failure, not a propagation delay."
          exit 1
