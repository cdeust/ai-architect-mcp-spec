name: Release

# The read-only build hands the .mcpb, CycloneDX SBOM, checksums and notes
# to a fresh runner. That runner checks the archive before signing and
# publishing. The registry job independently verifies the public bundle.
# All workspace packages are private. The marketplace consumes the git tree.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Recovery path only: republish an existing tag's server.json to the
          MCP Registry without rebuilding anything (e.g. v0.8.0). The GitHub
          Release for that tag must already be public with the .mcpb asset
          attached. Required for workflow_dispatch — there is no default,
          because guessing which tag to publish is the failure mode this job
          exists to remove.
        required: true
        type: string

permissions: {}

jobs:
  target:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$REF_NAME"
          fi
          # SemVer 2.0.0, including prerelease identifiers and build metadata.
          export LC_ALL=C
          number='(0|[1-9][0-9]*)'
          pre="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          meta='[0-9A-Za-z-]+'
          semver="^v$number\.$number\.$number(-$pre(\.$pre)*)?(\+$meta(\.$meta)*)?$"
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::Expected a release tag of the form v<SemVer>." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test, and package
    needs: target
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify product and distribution identities
        run: pnpm check:identity

      - name: Build all packages
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Rebuild and bundle MCP server
        run: pnpm bundle

      - name: Verify mcp-server bundle is current
        run: |
          # Rebuild the bundle and fail if the committed version diverges
          # from the rebuilt one (catches "I forgot to commit dist/" PRs).
          if [ -d packages/mcp-server/dist ]; then
            git diff --exit-code packages/mcp-server/dist/ \
              || (echo "::error::mcp-server bundle out of date — run 'pnpm build' and commit"; exit 1)
          fi

      - name: Verify the numbers the docs advertise are still true
        run: |
          set -euo pipefail
          # The test count is quoted in six user-facing places, including the
          # marketplace descriptions a prospective user reads. It went stale
          # twice in one working session (877 while the suite was 962, then 962
          # while it was 1496), so it is checked where it matters: at publish.
          pnpm check:docs

      - name: Assemble .mcpb staging directory
        run: |
          set -euo pipefail
          # Shared with the `mcpb smoke` job in ci.yml, deliberately. This step
          # used to inline the staging, so the tree that ships was assembled
          # only during a tag release and never started — which is how a .mcpb
          # whose declared command dies on `Cannot find module 'ajv'` reached
          # users past a green suite.
          STAGE_DIR="$(mktemp -d)/ai-architect-mcp-spec-mcpb"
          bash scripts/release/stage-mcpb.sh "${STAGE_DIR}"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

      - name: Smoke-test the staged bundle before packing it
        run: |
          set -euo pipefail
          # Speaks MCP to the staged tree using the command manifest.json
          # declares. A release stops here rather than shipping a server that
          # cannot start.
          bash scripts/release/smoke-mcpb.sh

      - name: Pack .mcpb bundle
        run: |
          set -euo pipefail
          OUTFILE="${GITHUB_WORKSPACE}/ai-architect-mcp-spec.mcpb"

          # Use @anthropic-ai/mcpb if available, else zip
          if npx -y @anthropic-ai/mcpb@2.1.2 pack --help >/dev/null 2>&1; then
            npx -y @anthropic-ai/mcpb@2.1.2 pack "${STAGE_DIR}" "${OUTFILE}"
          else
            (cd "${STAGE_DIR}" && zip -r "${OUTFILE}" .)
          fi

          # Compute SHA-256 checksum
          shasum -a 256 "${OUTFILE}" | awk '{print $1}' > "${OUTFILE}.sha256"
          echo "SHA256: $(cat "${OUTFILE}.sha256")"
          echo "MCPB_SHA256=$(cat "${OUTFILE}.sha256")" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM from pnpm-lock.yaml
        run: |
          set -euo pipefail
          # cdxgen reads pnpm-lock.yaml directly and walks the workspace, so
          # "what is actually in this bundle" — a genuinely hard question for a
          # bundled npm artifact (issue #29) — is answerable. Pinned by version;
          # this is an npm package, not a GitHub Action, so the SHA-pin rule
          # (criterion 8) does not apply, but the version is fixed so the run is
          # reproducible. FETCH_LICENSE stays off to keep the job network-light.
          npx -y @cyclonedx/cdxgen@12.8.2 -t pnpm --spec-version 1.5 \
            -o ai-architect-mcp-spec.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8'))"
          echo "SBOM components: $(node -e "console.log((JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8')).components||[]).length)")"
          shasum -a 256 ai-architect-mcp-spec.cdx.json | awk '{print $1}' > ai-architect-mcp-spec.cdx.json.sha256

      - name: Patch a local copy of server.json with the real .mcpb checksum
        run: |
          set -euo pipefail
          # This copy exists only on the runner, purely so the next step can
          # assert the patch logic and the checksum agree — it is never
          # committed and never pushed. The committed server.json omits
          # fileSha256 permanently: nothing reads it there (the field is
          # optional per scripts/check-distribution-identity.mjs), and the
          # registry publish job builds its own independently-verified
          # runtime copy (see the `publish_registry` job below) rather than
          # trusting this one.
          jq --arg sha "${MCPB_SHA256}" '.packages[0].fileSha256 = $sha' server.json > server.json.tmp
          mv server.json.tmp server.json
          jq empty server.json
          echo "Locally patched fileSha256: $(jq -r '.packages[0].fileSha256' server.json)"

      # Close the #23 defect class in the pipeline (issue #29 criterion 4): the
      # value we are about to publish MUST equal the artifact we built. This
      # recomputes the .mcpb digest and rejects any mismatch (exit 1) before
      # the registry sees it — defense in depth alongside the independent
      # re-verification `publish_registry` performs on the public release
      # asset. The same assertion is unit-tested in
      # scripts/release/verify-mcpb-checksum.test.mjs.
      - name: Verify the local server.json copy's checksum matches the built .mcpb
        run: |
          node scripts/release/verify-mcpb-checksum.mjs \
            ai-architect-mcp-spec.mcpb server.json

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # Pull the section between [VERSION] and the next [section] heading
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]")) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using tag message" > release-notes.md
          fi
          # Append SHA256 to release notes for auditability
          {
            echo ""
            echo "### Canonical .mcpb bundle"
            echo "Artifact: \`ai-architect-mcp-spec.mcpb\`"
            echo "SHA-256: \`${MCPB_SHA256}\`"
          } >> release-notes.md

      - name: Transfer release files
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.mcpb.sha256
            ai-architect-mcp-spec.cdx.json
            ai-architect-mcp-spec.cdx.json.sha256
            release-notes.md

  release:
    name: Attest and publish release
    needs: [target, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read         # download the immutable workflow artifact by ID
      contents: write       # create the release, upload assets
      id-token: write       # obtain a Sigstore signing certificate
      attestations: write   # record the provenance statements
    steps:
      - name: Verify and read release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/release.zip"
          endpoint="repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          run_id=$(gh api "$endpoint" --jq '.workflow_run.id')
          [[ "$run_id" == "$GITHUB_RUN_ID" ]] || { echo "::error::Artifact belongs to a different workflow run"; exit 1; }
          gh api "$endpoint/zip" > "$archive"
          actual=$(sha256sum "$archive" | cut -d ' ' -f 1)
          [[ "$actual" == "$ARCHIVE_SHA256" ]] || { echo "::error::Release artifact digest mismatch"; exit 1; }
          # Read only the fixed members as bytes. Never extract paths, permissions
          # or symlinks from the build into this runner.
          for file in ai-architect-mcp-spec.{mcpb,cdx.json}{,.sha256} release-notes.md; do
            unzip -p "$archive" "$file" > "./$file"
          done
          for file in ai-architect-mcp-spec.{mcpb,cdx.json}; do
            actual=$(sha256sum "$file" | cut -d ' ' -f 1)
            [[ "$actual" == "$(cat "$file.sha256")" ]] || { echo "::error::Checksum mismatch for $file"; exit 1; }
          done

      - name: Attest build provenance (.mcpb + SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.cdx.json

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(ai-architect-mcp-spec.{mcpb,cdx.json}{,.sha256})
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" --json id > /dev/null; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease="$prerelease"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" \
              --notes-file release-notes.md --prerelease="$prerelease"
          fi

  publish_registry:
    # Publishes server.json to the official MCP Registry
    # (registry.modelcontextprotocol.io) after the GitHub Release is public
    # with its .mcpb attached (needs: release), so it can never point the
    # registry at an artifact that does not exist yet. Also runs on
    # workflow_dispatch as a recovery path — the case that produced the
    # actual gap this job closes: v0.8.0 built, tested, and released cleanly
    # (release job green) while the registry kept serving v0.7.0, because no
    # job ever told it about any tag after v0.5.0.
    #
    # fileSha256 is a build artifact property (the digest of the zipped
    # .mcpb bundle). The committed server.json never carries it — the field
    # is optional there (scripts/check-distribution-identity.mjs) and no
    # consumer reads it from the committed file, so there is nothing to wait
    # on or merge. This job downloads the PUBLIC release asset, re-verifies
    # its checksum and provenance attestation itself, and patches a RUNTIME
    # copy of server.json (server.runtime.json) with the digest it just
    # independently confirmed. The committed server.json is never rewritten
    # by any job.
    name: Publish server.json to the MCP Registry
    needs: [target, release]
    if: |
      !cancelled() && needs.target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read # verify provenance of the public asset
      id-token: write   # OIDC token the MCP Registry exchanges for a publish credential
    steps:
      - name: Verify server.json version matches the tag being published
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          set -euo pipefail
          # Read the manifest as data at the exact commit whose provenance
          # the next step will verify. No repository checkout on this runner.
          commit=$(gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/server.json?ref=$commit" > server.json
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          VERSION=$(jq -r '.version' server.json)
          PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          [ "$TAG" = "v$VERSION" ] || { echo "::error::server.json version $VERSION does not match tag $TAG" >&2; exit 1; }
          [ "$VERSION" = "$PKG_VERSION" ] || { echo "::error::server.json top-level version $VERSION != packages[0].version $PKG_VERSION" >&2; exit 1; }
          IDENTIFIER=$(jq -r '.packages[0].identifier' server.json)
          [[ "$IDENTIFIER" == "https://github.com/$REPOSITORY/releases/download/$TAG/ai-architect-mcp-spec.mcpb" ]] || {
            echo "::error::Registry identifier does not match the public release asset" >&2; exit 1;
          }

      # The exact defect this job exists to prevent runs in both directions:
      # a registry entry must never point at a release asset that does not
      # exist or is not yet public. Download from the public release (the
      # `release` job already made it non-draft), verify its checksum against
      # the companion .sha256 asset and its provenance attestation, then use
      # THAT digest — never a value taken on trust from the committed file.
      - name: Download and verify the public .mcpb asset
        id: mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
          COMMIT: ${{ steps.manifest.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern 'ai-architect-mcp-spec.mcpb' \
            --pattern 'ai-architect-mcp-spec.mcpb.sha256'
          ACTUAL=$(shasum -a 256 ai-architect-mcp-spec.mcpb | awk '{print $1}')
          EXPECTED=$(cat ai-architect-mcp-spec.mcpb.sha256)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::ai-architect-mcp-spec.mcpb checksum mismatch: release asset is $ACTUAL, .sha256 companion says $EXPECTED" >&2; exit 1; }
          gh attestation verify ai-architect-mcp-spec.mcpb --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" --source-digest "$COMMIT"
          echo "digest=$ACTUAL" >> "$GITHUB_OUTPUT"

      # mcp-publisher has no first-party GitHub Action wrapper, so it is
      # fetched as a release binary and checksum-verified against the
      # registry project's own published checksum — the same supply-chain
      # discipline the pinned Actions above get via commit SHA, applied to a
      # raw binary download. Bump both MCP_PUBLISHER_VERSION and the SHA-256
      # together from https://github.com/modelcontextprotocol/registry/releases;
      # this exact pair was independently re-downloaded and re-hashed against
      # upstream on 2026-08-10, not copied on faith from the other repos that
      # use it.
      - name: Install mcp-publisher (checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euxo pipefail
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher

      # Patch a RUNTIME copy — the committed server.json is left untouched by
      # this job (see the job header comment for why).
      - name: Patch fileSha256 into a runtime copy of server.json
        env:
          DIGEST: ${{ steps.mcpb.outputs.digest }}
        run: jq --arg sha "$DIGEST" '.packages[0].fileSha256 = $sha' server.json > server.runtime.json

      # No secret: `mcp-publisher login github-oidc` exchanges this job's
      # GitHub Actions OIDC token for a registry credential scoped to
      # io.github.cdeust/*, using only the id-token: write permission above —
      # the same no-long-lived-credential posture as the Sigstore attestation
      # step in the `release` job.
      # Source: modelcontextprotocol/registry docs/reference/cli/commands.md
      # ("GitHub OIDC (CI/CD)") and docs/modelcontextprotocol-io/github-actions.mdx
      # ("OIDC authentication (recommended)"), verified 2026-08-10.
      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # A "cannot publish duplicate version" 400 means the registry already
      # has this exact version — the desired end state for the
      # workflow_dispatch recovery path (this job's header: v0.8.0 built and
      # released cleanly while the registry kept serving v0.7.0 because no
      # job ever told it, until re-run via workflow_dispatch). On the normal
      # push-tag path the same error means something is wrong: this job runs
      # once per tag (needs: [release]), so an existing entry there is
      # unexpected and must still fail loudly. The verify step below still
      # runs after a swallowed duplicate and independently confirms the
      # registry serves this version before the job can pass — this branch
      # narrows *which* mcp-publisher exit codes are treated as non-fatal, it
      # never widens what "passing" means.
      - name: Publish server.json to the MCP Registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish server.runtime.json 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && grep -qi "duplicate version" <<< "$OUTPUT"; then
              echo "::notice::mcp-publisher reports $TAG already published (workflow_dispatch recovery path) — treating as a candidate success, pending independent registry verification below."
            else
              echo "::error::mcp-publisher publish failed (exit ${STATUS})"
              exit "$STATUS"
            fi
          fi

      # A green `mcp-publisher publish` (or a swallowed duplicate-version
      # error above) is not proof. Query the registry's own API and fail the
      # job if it disagrees with what was published.
      #
      # Bounded retry, not zero-tolerance: the registry API sits behind a
      # CDN cache in front of all public read endpoints (modelcontextprotocol/
      # registry docs/design/tech-architecture.md, "CDN Layer"), so a read
      # immediately after publish can observe a stale, pre-publish entry.
      # Measured on cortex-viz's v3.1.1 release (2026-08-09), which hit this
      # same zero-tolerance check: publish completed at 16:48:46 UTC and a
      # read one second later, 16:48:47, still returned the prior version —
      # an empirical floor of >1s of staleness. No SLA for the cache TTL is
      # published, so the bound below is a stated engineering assumption,
      # not a measured constant: 12 attempts x 5s = 60s, an order of
      # magnitude above the observed 1s staleness, meant to absorb ordinary
      # CDN propagation without masking a genuine publish failure. It still
      # fails — this is a timeout, not an unbounded retry-until-pass — when
      # the registry never converges, which is exactly the case this check
      # exists to catch.
      - name: Verify the registry now serves the published version
        run: |
          set -euo pipefail
          VERSION=$(jq -ej '.version | strings | select(length > 0)' server.runtime.json)
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          ACTUAL=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ACTUAL=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=ai-architect-mcp-spec" \
              | jq -ej '
                if (.servers | type) != "array" then error("invalid registry response") else
                  (first(.servers[] | select(
                    .server.name == "io.github.cdeust/ai-architect-mcp-spec"
                    and ._meta["io.modelcontextprotocol.registry/official"].isLatest == true
                  )) // null)
                  | if . == null then ""
                    elif (.server.version | type) == "string" and (.server.version | length) > 0
                      then .server.version
                    else error("invalid latest registry version")
                    end
                end')
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: registry reports latest version ${ACTUAL:-<none>} (expected ${VERSION})"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Registry converged to ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "::error::MCP Registry still serves ${ACTUAL:-<none>}, expected ${VERSION} after ${MAX_ATTEMPTS} attempts (~$((MAX_ATTEMPTS * SLEEP_SECONDS))s). This is a non-convergence failure, not a propagation delay."
          exit 1
