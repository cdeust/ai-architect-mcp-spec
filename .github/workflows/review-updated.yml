name: Review updated
run-name: >-
  ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.issue.pull_request && (github.event.comment.user.login == 'claude[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.issue.number) && format('Review updated PR {0}', github.event.workflow_run.pull_requests[0].number || github.event.issue.number) || 'Unrelated event' }}
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [PR Review, Pipeline]
    types: [in_progress, completed]
permissions: {}
concurrency:
  group: review-proof-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
      && (github.event.comment.user.login == 'claude[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number
      && (github.event.action == 'completed' || github.event.workflow_run.name == 'PR Review')
      && (github.event.workflow_run.name != 'PR Review' || startsWith(github.event.workflow_run.display_title, 'Review PR '))
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the verified reviews on the PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: python3 -I scripts/ci_review_status.py
