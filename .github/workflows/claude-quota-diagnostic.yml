name: Claude subscription quota diagnostic

# Owner-only push experiment. workflow_dispatch is only available once a
# workflow exists on the default branch.
on:
  push:
    branches: [ci/claude-quota-diagnostic]
    paths:
      - .github/workflows/claude-quota-diagnostic.yml
      - .github/actions/claude-subscription-quota/**

permissions: {}

jobs:
  read-quota:
    if: >-
      github.repository == 'cdeust/ai-architect-mcp-spec'
      && github.actor_id == '3167767'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/claude-subscription-quota
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
