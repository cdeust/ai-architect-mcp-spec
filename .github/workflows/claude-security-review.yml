name: Claude Security Review

# Advisory security review of trusted pull requests, on the owner's Claude
# subscription. Design, threat model and tests: docs/claude-security-review.md.
# The name must stay out of every workflow_run list (Pipeline after merge and
# the subscription decision listen to "PR Review"): this review never wakes the
# merge resolver, which reads pipeline.yml and claude-review.yml only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One admission at a time per pull request, as for claude-review.yml: the
# budget counts completed reviews, so two overlapping runs would be admitted as
# the same round. A run in progress is never cancelled.
concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  security-review:
    name: Claude security review
    # Same trust rule as claude-review.yml: a head branch of this repository
    # (an author with write access), not a draft, not Dependabot. Fork code
    # never runs here, and no secret reaches it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # source: operational cap, the real bound on one review's cost.
    permissions:
      contents: read
      pull-requests: write # the action's tracking and inline comments
      id-token: write # the action's Claude GitHub App token exchange (OIDC)
      actions: read # the budget reads this workflow's earlier runs
    steps:
      # Every file this job executes or hands to the model comes from main.
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Find the trusted review on the default branch
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=""
          for file in scripts/ci_security_review.py \
            .github/claude-security-review/scan-instructions.txt \
            .github/claude-security-review/false-positive-filtering.txt \
            .github/claude-security-review/managed-settings.json; do
            [ -f "$file" ] || missing="$missing $file"
          done
          reason=""
          if [ "$HAS_TOKEN" != true ]; then
            reason="the CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
          elif [ -n "$missing" ]; then
            reason="not installed on main yet:$missing"
          fi
          if [ -n "$reason" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Claude security review skipped: $reason." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Count the security reviews this PR already received
        id: budget
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 -I scripts/ci_security_review.py budget
      - name: Measure Claude subscription quota
        id: quota
        if: steps.ready.outputs.ready == 'true' && steps.budget.outputs.skip == 'false'
        # './' is the workspace, which holds the main checkout above: the quota
        # action is main's copy, never the pull request's.
        uses: ./.github/actions/claude-subscription-quota # zizmor: ignore[self-repository]
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Decide whether the review runs
        id: decide
        if: steps.ready.outputs.ready == 'true'
        env:
          SKIP: ${{ steps.budget.outputs.skip }}
          ELIGIBLE: ${{ steps.quota.outputs.eligible }}
          REMAINING: ${{ steps.quota.outputs.remaining }}
        run: |
          set -euo pipefail
          if [ "$SKIP" != false ]; then
            reason="the review budget of this pull request is used"
          elif [ "$ELIGIBLE" != true ]; then
            reason="the Claude subscription has no headroom or usage credits are on (remaining: ${REMAINING:-unknown})"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Claude security review skipped: $reason." | tee -a "$GITHUB_STEP_SUMMARY"
      # Highest-precedence Claude Code settings, read-only and root-owned: no
      # shell, no edit, no network tool, no hook, no read of process, runner or
      # credential files, whatever the checked-out pull request contains.
      - name: Install read-only managed settings
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo install -D -m 0444 -o root -g root \
            .github/claude-security-review/managed-settings.json \
            /etc/claude-code/managed-settings.json
          sudo chmod 0555 /etc/claude-code
      - name: Prepare the diff and the prompt
        id: prompt
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED_SHA: ${{ steps.budget.outputs.reviewed_sha }}
          ROUND: ${{ steps.budget.outputs.round }}
          CAP: ${{ steps.budget.outputs.cap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python3 -I scripts/ci_security_review.py prompt
      # source: same step as claude-review.yml; runs only in a private repository.
      - name: Authorize pinned action fetch
        if: steps.decide.outputs.run == 'true' && github.event.repository.private
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          git config --local "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $basic"
      - name: Install subprocess isolation
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      # The engine. Everything above is the guard and stays when the engine
      # changes (docs/claude-security-review.md, "Engine").
      - name: Claude security review
        if: steps.decide.outputs.run == 'true'
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot]"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --strict-mcp-config
            --permission-mode dontAsk
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment"
            --model "claude-opus-5-5"
