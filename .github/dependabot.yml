# Dependency update tool (issue #36, Scorecard DependencyUpdateToolID).
#
# Two ecosystems, because the repo pins in two places and both go stale:
#   - npm            the pnpm workspace (root + packages/*), where the
#                    security floors in pnpm-workspace.yaml#overrides live
#                    (floors are raised by hand to an advisory's patched
#                    version; Dependabot proposes lockfile and manifest bumps)
#   - github-actions every `uses:` in .github/workflows is pinned by commit
#                    SHA (Scorecard PinnedDependenciesID), and a SHA pin never
#                    ages out on its own — without this, pinning trades a
#                    supply-chain risk for an unpatched-action risk
#
# Grouped so a routine bump is one reviewable PR rather than a dozen; security
# updates are deliberately NOT grouped, so an advisory fix arrives on its own
# and can be merged without waiting on unrelated version churn.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # better-sqlite3 13.x declares `engines.node: ">=22"`, and this project
      # declares `>=20.0.0` and tests 20.x in CI. Proposing 13 produces a PR
      # that can never pass: on Node 20 the vitest worker forks carrying the
      # native addon exit unexpectedly (3 files, 22 tests, observed on PR #44).
      # 12.11.1 declares `20.x||22.x||23.x||24.x` and is what we track.
      #
      # This is a version-currency hold, NOT a security one — better-sqlite3
      # has never appeared in this repo's advisory set, and minor/patch updates
      # inside 12.x still flow. Lift it in the same change that raises
      # `engines.node`, never on its own.
      - dependency-name: "better-sqlite3"
        versions: [">=13.0.0"]
    groups:
      npm-development:
        dependency-type: "development"
        applies-to: version-updates
      npm-production:
        dependency-type: "production"
        applies-to: version-updates
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
