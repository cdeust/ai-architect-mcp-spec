<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 365" width="1020" height="365" role="img" aria-labelledby="title description">
  <title id="title">Spec and Architect OS workflow</title>
  <desc id="description">The portable verifier checks an existing PRD. In the full workflow, a host drives PRD generation and verification. Spec reads validated Define, derives a deterministic Step proposal and can prepare a pinned Git dossier. Architect OS previews the plan. Independent provider review, specimen replay and evidence from delivery are pending for the paired loop.</desc>
  <style>
    svg { color-scheme: light dark; font-family: 'Inter Tight', system-ui, sans-serif }
    .canvas { fill: whitesmoke }
    text { fill: darkslategray; font-size: 16px }
    .heading { font-size: 20px; font-weight: 650 }
    .label { font-weight: 650 }
    .badge { font: 14px 'JetBrains Mono', ui-monospace, monospace }
    .card, .badge-box { fill: whitesmoke; stroke: darkslategray; stroke-width: 1 }
    .arrow { fill: none; stroke: darkslategray; stroke-width: 1.25; marker-end: url(#arrow) }
    .pending { stroke-dasharray: 5 4 }
    @media (prefers-color-scheme: dark) {
      .canvas, .card, .badge-box { fill: darkslategray }
      text, .arrowhead { fill: whitesmoke }
      .card, .badge-box, .arrow { stroke: whitesmoke }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" class="arrowhead" fill="darkslategray"/>
    </marker>
  </defs>
  <rect class="canvas" width="1020" height="365"/>
  <text class="heading" x="20" y="28">Verify an existing PRD</text>
  <rect class="card" x="20" y="43" width="242" height="61" rx="6"/>
  <text x="32" y="69" class="label">PRD sections and document</text>
  <text x="32" y="91">Optional symbol catalog</text>
  <path class="arrow" d="M262 74H282"/>
  <rect class="card" x="282" y="43" width="341" height="61" rx="6"/>
  <text x="294" y="69" class="label">Portable verifier</text>
  <text x="294" y="91">Rule violations and advisory findings</text>
  <rect class="badge-box" x="552" y="49" width="58" height="20" rx="9"/>
  <text class="badge" x="559" y="64">ready</text>

  <text class="heading" x="20" y="140">Generate a PRD and prepare a Step</text>
  <rect class="card" x="20" y="155" width="230" height="90" rx="6"/>
  <text x="32" y="183" class="label">Host and Spec</text>
  <text x="32" y="203">Draft, check and review</text>
  <text x="32" y="222">through MCP actions</text>
  <text x="32" y="240" font-size="14">Optional code graph</text>
  <path class="arrow" d="M250 200H270"/>
  <rect class="card" x="270" y="155" width="230" height="90" rx="6"/>
  <text x="282" y="183" class="label">Define handoff</text>
  <text x="282" y="207">Requirements and linked</text>
  <text x="282" y="229">acceptance criteria</text>
  <path class="arrow" d="M500 200H520"/>
  <rect class="card" x="520" y="155" width="230" height="90" rx="6"/>
  <text x="532" y="183" class="label">Spec proposal</text>
  <text x="532" y="207">One deterministic Step</text>
  <text x="532" y="229">bound to Define</text>
  <path class="arrow" d="M750 200H770"/>
  <rect class="card" x="770" y="155" width="230" height="90" rx="6"/>
  <text x="782" y="183" class="label">Architect OS preview</text>
  <text x="782" y="207">Operator policy and inputs</text>
  <text x="782" y="229">Approval remains separate</text>
  <rect class="badge-box" x="938" y="121" width="62" height="22" rx="9"/>
  <text class="badge" x="946" y="137">ready</text>

  <rect class="card" x="20" y="266" width="480" height="80" rx="6"/>
  <text x="32" y="294" class="label">Operator-requested implementation dossier</text>
  <text x="32" y="321">Pinned Git diff and evidence required per criterion</text>
  <rect class="badge-box" x="428" y="272" width="58" height="20" rx="9"/>
  <text class="badge" x="435" y="287">ready</text>

  <rect class="card pending" x="520" y="266" width="480" height="80" rx="6"/>
  <text x="532" y="294" class="label">Paired loop</text>
  <text x="532" y="321">Independent Plan review, specimens and delivery evidence</text>
  <rect class="badge-box" x="938" y="272" width="48" height="20" rx="9"/>
  <text class="badge" x="945" y="287">next</text>
</svg>
