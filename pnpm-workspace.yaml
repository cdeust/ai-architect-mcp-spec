# pnpm settings live here, not in package.json#pnpm: pnpm 11 no longer reads
# the `pnpm` field of package.json (reproduced: `pnpm@11 install --lockfile-only`
# on the previous layout deleted the lockfile's `overrides:` block), and
# Dependabot's updater image ships pnpm 11 by default (dependabot-core
# npm_and_yarn/Dockerfile, PNPM_VERSION=11.25.0); its PRs shipped a lockfile
# without the overrides and failed `pnpm install --frozen-lockfile` with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. pnpm 10 (CI) and pnpm 11 both read `overrides`
# from this file. pnpm 11 removed `onlyBuiltDependencies` in favour of
# `allowBuilds` and deprecates `auditConfig.ignoreGhsas` in favour of
# `audit.ignore`; both are kept here because CI runs pnpm 10.
packages:
  - "packages/*"

onlyBuiltDependencies:
  - better-sqlite3

auditConfig:
  # Issue #36: the ignore list is EMPTY and stays empty. Every GHSA it used to carry now has a published fix pinned in `overrides` below, so `pnpm audit --prod --audit-level high` blocks on real findings only. The former rationale claimed mathjs was 'absent from the shipped .mcpb' — that was false: `grep -c mathjs mcp-server/index.js` returns 709 on the bundle it described, so the 2-major bump was owed, not optional. Every override floor is the `first_patched_version` GitHub's advisory API reports for that GHSA, and each satisfies its declaring parent's own range (see SECURITY.md). Add an entry here only when an advisory has NO published fix, and only with the reproduction that shows it.
  ignoreGhsas: []

overrides:
  "@hono/node-server": "^2.0.5"
  "body-parser": "^2.3.0"
  "fast-uri": "^3.1.8"
  "hono": "^4.12.34"
  "ip-address": "^10.1.1"
  "postcss": "^8.5.18"
  "proxy-addr": "^2.0.8"
  "qs": "^6.15.2"
  "vite": "^8.0.16"
