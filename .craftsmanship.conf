# Project-local craftsmanship gate config (rules/coding-standards.md §4).
# Sourced by zetetic-team-subagents/tools/craftsmanship-checker.sh after its
# env defaults; fully tunable, no anti-tamper guard (tool's own contract).

# mcp-server/index.js is the self-contained ESM bundle `pnpm bundle` produces
# from packages/mcp-server/dist/ via esbuild (single-file, minified-shaped
# output; CI's "Bundle freshness check" step fails the build if it is not
# byte-identical to a fresh `pnpm bundle` run, so it is never hand-edited).
# CRAFT_SKIP_EXT already exempts `*.min.js`; this file's fixed name does not
# match that glob, so it is added to the path skip-list explicitly instead of
# renaming a name the marketplace install and .mcp.json both depend on.
CRAFT_SKIP_PATHS="${CRAFT_SKIP_PATHS}|(^|/)mcp-server/index\\.js\$"
